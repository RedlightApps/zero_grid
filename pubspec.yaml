name: zero_grid
description: 120Hz 2D-virtualized DataGrid & Spreadsheet engine for Flutter. Supports 1,000,000+ rows, left/right column freezing, background Isolate sorting/filtering, and Excel-style marquee range selection with TSV clipboard export. Zero external dependencies.
version: 1.0.2
homepage: https://redlightapps.com
repository: https://github.com/RedlightApps/zero_grid
issue_tracker: https://github.com/RedlightApps/zero_grid/issues
documentation: https://github.com/RedlightApps/zero_grid#readme

screenshots:
  - description: "Live 120Hz Demo: 100,000-Row 2D Virtualized Scrolling, Frozen L/R Panes, Marquee Range Selection & Instant Filtering"
    path: doc/screenshots/zero_grid_demo.gif
  - description: "120Hz 100,000-row 2D Virtualized DataGrid with Left/Right Frozen Panes, Excel Marquee Selection & Footer Totals"
    path: doc/screenshots/zero_grid_showcase.png

funding:
  - https://www.buymeacoffee.com/yusufkaval
  - https://github.com/sponsors/kvlyusuf
  - https://github.com/sponsors/RedlightApps

topics:
  - datagrid
  - spreadsheet
  - table
  - virtualization
  - isolate

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
